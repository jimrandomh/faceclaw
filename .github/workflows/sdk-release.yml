name: SDK release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: npm ci
      - name: Verify source, SDK and standalone consumers
        env:
          APK_AUDIT_OUTPUT: ${{ runner.temp }}/sdk-audit
        run: scripts/audit-apk-platform.sh --allow-known-upstream-failures
      - name: Build compatible host
        run: npx nativescript build android --no-hmr
      - name: Package unchanged candidate and corresponding source
        env:
          SDK_AUDIT: ${{ runner.temp }}/sdk-audit
        run: |
          mapfile -t apks < <(find platforms/android/app/build/outputs/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then echo 'Expected one host APK' >&2; exit 1; fi
          python3 android-sdk/scripts/package-sdk-candidate.py --audit "$SDK_AUDIT" --host-apk "${apks[0]}" --output dist/sdk-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: faceclaw-sdk-candidate
          path: dist/sdk-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceclaw-sdk-candidate-evidence
          path: ${{ runner.temp }}/sdk-audit/
          if-no-files-found: warn
