name: SDK release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - run: npm ci
      - name: Verify source, SDK and standalone consumers
        env:
          APK_AUDIT_OUTPUT: ${{ runner.temp }}/sdk-audit
        run: scripts/audit-apk-platform.sh --allow-known-upstream-failures
      - name: Build compatible host
        run: npx nativescript build android --no-hmr
      - name: Package unchanged candidate and corresponding source
        env:
          SDK_AUDIT: ${{ runner.temp }}/sdk-audit
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tarfile
          audit = pathlib.Path(os.environ['SDK_AUDIT'])
          kit = audit / 'portable-kit'
          metadata = json.loads((kit / 'PORTABLE-KIT.json').read_text())
          if metadata['sourceDirty']:
              raise SystemExit('Release candidate requires clean source')
          dist = pathlib.Path('dist')
          dist.mkdir()
          version = metadata['coordinate'].rsplit(':', 1)[1]
          with tarfile.open(dist / f'faceclaw-sdk-{version}.tar.gz', 'w:gz') as archive:
              archive.add(kit, arcname=f'faceclaw-sdk-{version}')
          subprocess.run(['git', 'archive', '--format=tar.gz', f'--output={dist}/faceclaw-source.tar.gz', metadata['sourceRevision']], check=True)
          apks = list(pathlib.Path('platforms/android/app/build/outputs/apk').rglob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected one host APK')
          shutil.copy2(apks[0], dist / 'faceclaw-host-debug.apk')
          shutil.copy2(kit / 'PORTABLE-KIT.json', dist / 'PORTABLE-KIT.json')
          shutil.copy2(audit / 'audit.json', dist / 'audit.json')
          (dist / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(dist.iterdir())))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: faceclaw-sdk-candidate
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceclaw-sdk-candidate-evidence
          path: ${{ runner.temp }}/sdk-audit/
          if-no-files-found: warn
